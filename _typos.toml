# typos configuration
#
# Scope: this repo's OWN files. Vendored trees are excluded rather than corrected -
# they are upstream copies, so fixing spelling in them would only create diff noise
# that the next update reverts.
[files]
extend-exclude = [
  "dot_claude/skills/**",              # vendored Anthropic skill library
  "dot_hammerspoon/hs/**",             # vendored hs.spaces library + its generated docs
  "dot_config/nvim-astronvim/**",      # vendored AstroNvim template
  "dot_config/nvim-lazyvim/**",        # vendored LazyVim template
  "dot_p10k.zsh",                      # generated by the p10k configuration wizard
  "docs/FILE-RENAMING-MAP.md",         # deliberately lists old, misspelt filenames
  "*.lock",
]

[default.extend-words]
# Proper nouns and identifiers that are not misspellings.
Hashi = "Hashi"                        # HashiCorp, as in hashicorp/tap
Noice = "Noice"                        # folke/noice.nvim
