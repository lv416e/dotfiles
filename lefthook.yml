# =============================================================================
# Lefthook Configuration - Git Hooks Management
# =============================================================================
# Docs: https://github.com/evilmartians/lefthook
#
# Setup: Run `lefthook install` to install Git hooks
# Usage: Hooks run automatically on git commit/push
# Skip:  LEFTHOOK=0 git commit -m "skip all hooks"
#        LEFTHOOK_EXCLUDE=gitleaks git commit -m "skip gitleaks only"

# Execute commands in parallel for better performance
parallel: true

# =============================================================================
# Pre-Commit Hooks - Run before git commit
# =============================================================================
pre-commit:
  commands:
    # --------------------------------------------------------------------------
    # Gitleaks - Detect hardcoded secrets
    # --------------------------------------------------------------------------
    gitleaks:
      # Only scan relevant file types
      glob: "*.{yml,yaml,toml,sh,zsh,bash,json,env,txt,tmpl,lua}"
      # Scan only staged files (faster than full repo scan)
      # Use mise exec to ensure gitleaks is in PATH
      run: mise exec -- gitleaks protect --verbose --redact --staged
      # Skip during merge/rebase (too noisy)
      skip:
        - merge
        - rebase

    # --------------------------------------------------------------------------
    # File Size Check - Prevent committing large files
    # --------------------------------------------------------------------------
    check-file-size:
      glob: "*"
      run: |
        for file in $(git diff --cached --name-only); do
          # Skip if file doesn't exist (deleted files)
          [ -f "$file" ] || continue

          # Get file size (macOS and Linux compatible)
          size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)

          # Check if file is larger than 1MB
          if [ "$size" -gt 1048576 ]; then
            size_human=$(numfmt --to=iec-i --suffix=B "$size" 2>/dev/null || echo "$size bytes")
            echo "❌ File too large: $file ($size_human > 1MB)"
            echo "   Large files should not be committed to dotfiles."
            echo "   Consider using Git LFS or external storage."
            exit 1
          fi
        done

    # --------------------------------------------------------------------------
    # Private Key Check - Prevent committing private keys
    # --------------------------------------------------------------------------
    check-private-keys:
      glob: "*.{key,pem,p12,pfx,cer,crt,der}"
      run: |
        # Check for private key files in staged changes
        files=$(git diff --cached --name-only | grep -E '\.(key|pem|p12|pfx|cer|crt|der)$' || true)

        if [ -n "$files" ]; then
          echo "❌ Attempting to commit private key files:"
          echo "$files" | sed 's/^/   /'
          echo ""
          echo "Private keys should NEVER be committed to git."
          echo "Use age encryption: chezmoi add --encrypt <file>"
          exit 1
        fi

    # --------------------------------------------------------------------------
    # GitHub Actions - Syntax (actionlint) and security (zizmor)
    # --------------------------------------------------------------------------
    # CI runs actionlint and ghalint already, but only after a push. These run the
    # same checks locally so a broken or unsafe workflow never leaves the machine.
    # zizmor is the piece CI lacks: it covers expression injection, unpinned
    # actions, over-broad permissions and dangerous triggers.
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint -color {staged_files}

    zizmor:
      glob: ".github/workflows/*.{yml,yaml}"
      # Gate at `high`, which is clean. 3 medium findings remain, all ref-version-mismatch
      # on actions whose pinned SHA zizmor cannot map to a tag (markdown-link-check,
      # gitleaks-action, dependency-review-action). The other 12 were fixed with
      # `--fix=all`, which - verified by diffing a copy first - only rewrites the version
      # COMMENT (`# v4` -> `# v4.3.0`) and never touches the SHA, so CI behaviour is
      # unchanged. zizmor calls that unsafe because the comment's meaning changes.
      run: zizmor --min-severity high {staged_files}

    # --------------------------------------------------------------------------
    # TOML - Format check (taplo)
    # --------------------------------------------------------------------------
    taplo:
      glob: "*.toml"
      # `lint`, deliberately not `fmt --check`. Measured: 4 of the 9 plain TOML files
      # here (.chezmoiexternal, .gitleaks, helix/config, nvim-lazyvim/stylua) differ
      # from taplo's formatting opinion, so a format gate would block commits over
      # style with no defect behind it. `lint` catches the real problems - duplicate
      # keys, type errors, schema violations - and all 9 files pass it today.
      # Formatting stays available on demand via `taplo fmt`.
      run: taplo lint {staged_files}

    # --------------------------------------------------------------------------
    # Spelling (typos)
    # --------------------------------------------------------------------------
    # Gating on this is only viable because _typos.toml excludes the vendored trees.
    # Unconfigured it reports 265 findings, almost all false positives in upstream
    # copies (dot_claude/skills, hs.spaces, the nvim templates) plus proper nouns
    # like Noice and Hashi. With the config the repo's own files report zero, so a
    # hook failure now means a real new typo.
    typos:
      glob: "*"
      run: typos {staged_files}

    # --------------------------------------------------------------------------
    # Chezmoi Configuration Check - Validate .chezmoi.toml.tmpl
    # --------------------------------------------------------------------------
    check-chezmoi-config:
      glob: ".chezmoi.toml.tmpl"
      run: |
        # Check if secrets = "error" is still set
        if ! grep -q 'secrets = "error"' .chezmoi.toml.tmpl; then
          echo "⚠️  Warning: 'secrets = \"error\"' not found in .chezmoi.toml.tmpl"
          echo "   This setting prevents accidental secret commits."
          echo "   Consider adding it to [add] section."
        fi

# =============================================================================
# Pre-Push Hooks - Run before git push
# =============================================================================
pre-push:
  commands:
    # --------------------------------------------------------------------------
    # Full Repository Scan - Deep security check before push
    # --------------------------------------------------------------------------
    gitleaks-full:
      # Only run if gitleaks config exists or use default
      # Use mise exec to ensure gitleaks is in PATH
      run: |
        echo "🔍 Running full repository scan before push..."
        if [ -f .gitleaks.toml ]; then
          mise exec -- gitleaks detect --config .gitleaks.toml --verbose --redact
        else
          mise exec -- gitleaks detect --verbose --redact
        fi
      # Skip in CI (already scanned in pre-commit)
      skip:
        - ref: main
        - ref: master

    # --------------------------------------------------------------------------
    # Link Check - Verify documentation links before publishing
    # --------------------------------------------------------------------------
    # Pre-push rather than pre-commit: this hits the network, so it is too slow and
    # too flaky to gate every commit. Replaces the orphaned
    # .github/markdown-link-check-config.json, which nothing referenced.
    lychee:
      run: |
        echo "🔗 Checking internal documentation links..."
        # --offline: only relative/file links are checked, so this gate is deterministic
        # and needs no network. External URLs die for reasons outside this repo - a
        # third-party blog disappearing should never block a push. Sweep those on
        # purpose instead, and expect to find some:
        #   lychee README.md 'docs/**/*.md'
        lychee --offline --no-progress README.md 'docs/**/*.md' || {
          echo "⚠️  Broken internal links. Re-run: lychee --offline README.md 'docs/**/*.md'"
          exit 1
        }

# =============================================================================
# Skip Configuration
# =============================================================================
# Don't show meta information (cleaner output)
skip_output:
  - meta
  - summary

# Follow symlinks when checking files
follow_symlinks: false
